[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.3"
license = "MIT"
repository = "https://github.com/poneding/morn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
thiserror = "2"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
