[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "morn"
path = "src/main.rs"

[dependencies]
eframe = "0.34"
egui = "0.34"
wgpu = "29.0"
engine = { path = "../engine" }
player-core = { path = "../player-core" }
render = { path = "../render" }
sync = { path = "../sync" }
media = { path = "../media" }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
rust-i18n = "4"
semver = "1"
serde.workspace = true
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["NSAlert", "NSApplication", "NSBitmapImageRep", "NSButton", "NSColor", "NSControl", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "objc2-quartz-core"] }
objc2-foundation = { version = "0.2", features = ["NSBundle", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSThread", "NSURL"] }
